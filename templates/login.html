{% extends "base_public.html" %}
{% block title %}Log in | StudySync{% endblock %}
{% block content %}
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h2 fw-bold mb-2">Welcome back</h1>
                    <p class="text-muted mb-4">Log in to continue organising your student life.</p>
                    <form method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="email">Email</label>
                            <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="password">Password</label>
                            <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary w-100">Log in</button>
                    </form>
                    <p class="text-center text-muted mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}

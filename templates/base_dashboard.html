<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StudySync{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">StudySync</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('assignments') }}">Assignments</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('notes') }}">Notes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('timetable') }}">Timetable</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('progress') }}">Progress</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('goals') }}">Goals</a></li>
                    {% if current_user.is_admin %}<li class="nav-item"><a class="nav-link" href="{{ url_for('admin_users') }}">Users</a></li>{% endif %}
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="{{ url_for('pomodoro') }}" class="text-dark" title="Pomodoro timer"><i class="bi bi-alarm fs-5"></i></a>
                    <a href="{{ url_for('profile') }}" class="text-dark" title="Profile"><i class="bi bi-person-circle fs-4"></i></a>
                    <form method="post" action="{{ url_for('logout') }}" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button class="btn btn-sm btn-outline-secondary">Log out</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    {% include "_flashes.html" %}
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

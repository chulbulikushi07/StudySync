<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StudySync{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{{ url_for('home') }}">StudySync</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('home') }}#features">Features</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="{{ url_for('home') }}#about">About</a></li>
                </ul>
                {% if current_user %}
                    <a class="btn btn-primary shadow-sm rounded" href="{{ url_for('dashboard') }}">Dashboard</a>
                {% else %}
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-primary" href="{{ url_for('login') }}">Log in</a>
                        <a class="btn btn-primary" href="{{ url_for('register') }}">Get started</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </nav>

    {% include "_flashes.html" %}
    {% block content %}{% endblock %}

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <h5 class="fw-bold">StudySync</h5>
            <p class="mb-0 text-light">Your all-in-one student productivity hub.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
